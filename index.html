<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read With Me | Cozy Bookshelf & Nook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #e5dfd3;
      --wood-dark: #2c1a0e;
      --wood-mid: #4a2e1b;
      --wood-light: #5c3a21;
      --shelf-shadow: rgba(0, 0, 0, 0.4);
      --text-gold: #e2c08d;
      --paper-white: #f8f5ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Playfair Display', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas cho cánh hoa rơi */
    #petals-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Thanh công cụ / Top Bar */
    .header-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    .site-title {
      font-size: 1.5rem;
      color: #3a2e2b;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .edit-toggle-btn {
      background: #3a2e2b;
      color: #f8f5ee;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .edit-toggle-btn:hover {
      background: #5c3a21;
      transform: translateY(-1px);
    }

    .edit-toggle-btn.active {
      background: #8c2d19;
    }

    /* Bố cục chính */
    .container {
      display: flex;
      gap: 40px;
      max-width: 1000px;
      width: 100%;
      align-items: flex-start;
      z-index: 2;
    }

    /* Sảnh / Khung Polaroid */
    .gallery-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .polaroid-frame {
      background: var(--paper-white);
      padding: 18px 18px 25px 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15), 0 2px 5px rgba(0,0,0,0.05);
      border-radius: 2px;
      width: 100%;
      max-width: 380px;
      transition: transform 0.3s ease;
      position: relative;
    }

    .polaroid-frame:hover {
      transform: rotate(-1deg) scale(1.01);
    }

    .photo-wrapper {
      width: 100%;
      height: 480px;
      background-color: #6b6343;
      background-image: linear-gradient(135deg, #7a704d 0%, #524b33 100%);
      overflow: hidden;
      position: relative;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #2b2b2b;
      margin-top: 15px;
      text-align: left;
      outline: none;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .edit-mode .polaroid-caption[contenteditable="true"] {
      border: 1px dashed #a08265;
      background: rgba(255,255,255,0.6);
    }

    .upload-btn-wrapper {
      margin-top: 10px;
      display: none;
    }

    .edit-mode .upload-btn-wrapper {
      display: block;
    }

    .file-input {
      display: none;
    }

    .custom-file-upload {
      display: inline-block;
      padding: 6px 12px;
      cursor: pointer;
      background: #5c3a21;
      color: white;
      border-radius: 4px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
    }

    /* Kệ Sách */
    .bookshelf-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }

    .bookshelf {
      background: linear-gradient(to right, var(--wood-dark), var(--wood-mid), var(--wood-dark));
      border: 12px solid var(--wood-dark);
      border-radius: 6px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 12px 30px rgba(0,0,0,0.3);
      padding: 0;
      position: relative;
    }

    .shelf {
      height: 200px;
      border-bottom: 16px solid var(--wood-light);
      box-shadow: 0 8px 12px var(--shelf-shadow);
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 0 15px;
      gap: 4px;
    }

    .shelf::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(0,0,0,0.4);
    }

    /* Trang trí trên kệ */
    .plant-decor {
      position: absolute;
      right: 20px;
      bottom: 0;
      width: 45px;
      height: 70px;
      pointer-events: none;
    }

    .candle-decor {
      position: absolute;
      right: 20px;
      bottom: 0;
      width: 35px;
      height: 65px;
      pointer-events: none;
    }

    /* Quy chuẩn Sách */
    .book {
      height: 140px;
      width: 32px;
      background-color: #3b5998;
      border-radius: 2px 4px 4px 2px;
      cursor: pointer;
      position: relative;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ecdab9;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.3), inset 3px 0 4px rgba(255,255,255,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s;
      user-select: none;
      flex-shrink: 0;
    }

    .book:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: -4px 0 8px rgba(0,0,0,0.4), inset 3px 0 4px rgba(255,255,255,0.3);
    }

    .book.falling {
      animation: fallDown 0.6s ease-in forwards;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      50% { transform: translateY(100px) rotate(15deg); opacity: 0.5; }
      100% { transform: translateY(200px) rotate(45deg); opacity: 0; }
    }

    .book-title-text {
      padding: 8px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 130px;
    }

    /* Khu vực sách rơi / Góc đọc */
    .reading-nook {
      background: linear-gradient(to bottom, #1a0f08, #2c1a0e);
      min-height: 120px;
      padding: 15px;
      text-align: center;
      position: relative;
      border-top: 4px solid var(--wood-dark);
    }

    .nook-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--text-gold);
      font-size: 1.1rem;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    .fallen-books-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: flex-end;
      min-height: 50px;
    }

    /* Sách khi ở góc đọc bên dưới */
    .fallen-book {
      height: 30px;
      width: 130px;
      writing-mode: horizontal-tb;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ecdab9;
      font-size: 0.75rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.2s;
      animation: landBook 0.4s ease-out;
    }

    @keyframes landBook {
      from { transform: translateY(-20px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .fallen-book:hover {
      transform: translateY(-3px);
    }

    /* Chỉnh sửa Sách điều khiển */
    .add-book-panel {
      margin-top: 15px;
      background: var(--paper-white);
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .edit-mode .add-book-panel {
      display: flex;
    }

    .form-group {
      display: flex;
      gap: 10px;
    }

    .form-input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      flex: 1;
    }

    .btn {
      background: var(--wood-mid);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
    }

    .btn:hover {
      background: var(--wood-dark);
    }

    .delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #8c2d19;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      writing-mode: horizontal-tb;
    }

    .edit-mode .book .delete-btn {
      display: flex;
    }
  </style>
</head>
<body>

  <canvas id="petals-canvas"></canvas>

  <div class="header-bar">
    <div class="site-title">Read With Me</div>
    <button class="edit-toggle-btn" id="editToggleBtn">Enable Edit Mode</button>
  </div>

  <div class="container">
    <!-- Phần Sảnh / Cửa sổ (Polaroid Gallery) -->
    <div class="gallery-section">
      <div class="polaroid-frame">
        <div class="photo-wrapper">
          <img id="hallImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500' viewBox='0 0 400 500'><rect width='400' height='500' fill='%23625b43'/><circle cx='200' cy='250' r='80' fill='%2370674c' opacity='0.5'/></svg>" alt="A quiet window view">
        </div>
        <div class="polaroid-caption" id="hallCaption" contenteditable="false">a quiet window</div>
      </div>
      <div class="upload-btn-wrapper">
        <label for="imageUpload" class="custom-file-upload">
          Change Image
        </label>
        <input type="file" id="imageUpload" class="file-input" accept="image/*">
      </div>
    </div>

    <!-- Phần Tủ Sách -->
    <div class="bookshelf-section">
      <div class="bookshelf">
        <!-- Kệ trên -->
        <div class="shelf" id="shelf1">
          <!-- Cây trang trí SVGs -->
          <svg class="plant-decor" viewBox="0 0 60 90">
            <path d="M30 60 L30 90" stroke="#3a2518" stroke-width="4"/>
            <path d="M20 70 L40 70 L36 90 L24 90 Z" fill="#b06c49"/>
            <circle cx="20" cy="45" r="12" fill="#5b7052"/>
            <circle cx="38" cy="40" r="14" fill="#68825c"/>
            <circle cx="28" cy="25" r="15" fill="#78966a"/>
          </svg>
        </div>

        <!-- Kệ dưới -->
        <div class="shelf" id="shelf2">
          <!-- Nến trang trí SVGs -->
          <svg class="candle-decor" viewBox="0 0 40 70">
            <rect x="12" y="30" width="16" height="35" fill="#f4ebd9" rx="2"/>
            <rect x="10" y="65" width="20" height="5" fill="#8c6d53"/>
            <line x1="20" y1="30" x2="20" y2="22" stroke="#333" stroke-width="2"/>
            <ellipse cx="20" cy="16" rx="4" ry="7" fill="#facc15"/>
          </svg>
        </div>

        <!-- Khu vực sách rơi -->
        <div class="reading-nook">
          <div class="nook-title">Fallen books land here.</div>
          <div class="fallen-books-container" id="fallenContainer"></div>
        </div>
      </div>

      <!-- Bảng chỉnh sửa Sách (hiển thị khi bật Edit Mode) -->
      <div class="add-book-panel" id="addBookPanel">
        <h4 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; color: #333;">Add New Book</h4>
        <div class="form-group">
          <input type="text" id="bookTitleInput" class="form-input" placeholder="Book Title...">
          <select id="shelfSelect" class="form-input">
            <option value="shelf1">Top Shelf</option>
            <option value="shelf2">Bottom Shelf</option>
          </select>
        </div>
        <div class="form-group">
          <input type="color" id="bookColorInput" value="#3b5998" style="height: 35px; width: 50px; border:none; cursor:pointer;">
          <input type="text" id="textColorInput" class="form-input" placeholder="Text Color (e.g. #fff)" value="#ecdab9">
          <button class="btn" id="addBookBtn">Add Book</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. DỮ LIỆU SÁCH BAN ĐẦU (TIẾNG ANH) ---
    const initialBooks = [
      { id: '1', title: 'Norwegian Wood', color: '#2d4a3e', textColor: '#e2c08d', shelf: 'shelf1', height: 145, width: 34 },
      { id: '2', title: 'The Lover', color: '#8c533e', textColor: '#f2e3d5', shelf: 'shelf1', height: 135, width: 30 },
      { id: '3', title: 'The Sorrows of Young Werther', color: '#2b2b2b', textColor: '#ffffff', shelf: 'shelf1', height: 155, width: 32 },
      { id: '4', title: 'Thinking, Fast and Slow', color: '#d9a74a', textColor: '#1a1a1a', shelf: 'shelf1', height: 160, width: 42 },
      { id: '5', title: 'The Catcher in the Rye', color: '#8c2d19', textColor: '#f8f5ee', shelf: 'shelf2', height: 140, width: 32 },
      { id: '6', title: 'The Old Man and the Sea', color: '#2a5c68', textColor: '#e0f2fe', shelf: 'shelf2', height: 130, width: 36 },
      { id: '7', title: 'A Room of One\'s Own', color: '#4a3b5c', textColor: '#ebd9fc', shelf: 'shelf2', height: 125, width: 38 },
      { id: '8', title: 'The Little Prince', color: '#1e3a5f', textColor: '#fde68a', shelf: 'shelf2', height: 135, width: 34 }
    ];

    let books = [...initialBooks];
    let fallenBooks = [];
    let isEditMode = false;

    // --- 2. HIỂN THỊ TỦ SÁCH ---
    function renderBooks() {
      document.getElementById('shelf1').querySelectorAll('.book').forEach(b => b.remove());
      document.getElementById('shelf2').querySelectorAll('.book').forEach(b => b.remove());

      books.forEach(book => {
        const shelfEl = document.getElementById(book.shelf);
        if (!shelfEl) return;

        const bookEl = document.createElement('div');
        bookEl.className = 'book';
        bookEl.dataset.id = book.id;
        bookEl.style.backgroundColor = book.color;
        bookEl.style.color = book.textColor;
        bookEl.style.height = `${book.height}px`;
        bookEl.style.width = `${book.width}px`;

        bookEl.innerHTML = `
          <span class="book-title-text">${book.title}</span>
          <div class="delete-btn" onclick="deleteBook(event, '${book.id}')">✕</div>
        `;

        bookEl.addEventListener('click', (e) => {
          if (isEditMode) return;
          dropBook(book.id, bookEl);
        });

        shelfEl.appendChild(bookEl);
      });

      renderFallenBooks();
    }

    // Drop Book (Hiệu ứng sách rơi xuống)
    function dropBook(bookId, element) {
      element.classList.add('falling');
      setTimeout(() => {
        const index = books.findIndex(b => b.id === bookId);
        if (index !== -1) {
          const [movedBook] = books.splice(index, 1);
          fallenBooks.push(movedBook);
          renderBooks();
        }
      }, 500);
    }

    // Return Book (Trả sách lại kệ)
    function returnBook(bookId) {
      const index = fallenBooks.findIndex(b => b.id === bookId);
      if (index !== -1) {
        const [returnedBook] = fallenBooks.splice(index, 1);
        books.push(returnedBook);
        renderBooks();
      }
    }

    function renderFallenBooks() {
      const container = document.getElementById('fallenContainer');
      container.innerHTML = '';

      fallenBooks.forEach(book => {
        const fallenEl = document.createElement('div');
        fallenEl.className = 'fallen-book';
        fallenEl.style.backgroundColor = book.color;
        fallenEl.style.color = book.textColor;
        fallenEl.innerText = book.title;
        fallenEl.title = "Click to return to shelf";

        fallenEl.addEventListener('click', () => {
          if (!isEditMode) returnBook(book.id);
        });

        container.appendChild(fallenEl);
      });
    }

    // Xóa sách ở Edit Mode
    window.deleteBook = function(e, bookId) {
      e.stopPropagation();
      books = books.filter(b => b.id !== bookId);
      fallenBooks = fallenBooks.filter(b => b.id !== bookId);
      renderBooks();
    }

    // --- 3. CHẾ ĐỘ CHỈNH SỬA (EDIT MODE) ---
    const editToggleBtn = document.getElementById('editToggleBtn');
    const hallCaption = document.getElementById('hallCaption');

    editToggleBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      
      if (isEditMode) {
        editToggleBtn.innerText = 'Exit Edit Mode';
        editToggleBtn.classList.add('active');
        hallCaption.setAttribute('contenteditable', 'true');
      } else {
        editToggleBtn.innerText = 'Enable Edit Mode';
        editToggleBtn.classList.remove('active');
        hallCaption.setAttribute('contenteditable', 'false');
      }
    });

    // Tải ảnh mới cho Sảnh/Khung Polaroid
    document.getElementById('imageUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('hallImage').src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Thêm sách mới
    document.getElementById('addBookBtn').addEventListener('click', () => {
      const title = document.getElementById('bookTitleInput').value.trim();
      const shelf = document.getElementById('shelfSelect').value;
      const color = document.getElementById('bookColorInput').value;
      const textColor = document.getElementById('textColorInput').value;

      if (!title) return alert('Please enter a book title!');

      const newBook = {
        id: Date.now().toString(),
        title: title,
        color: color,
        textColor: textColor,
        shelf: shelf,
        height: Math.floor(Math.random() * 30) + 130, // Random height 130-160
        width: Math.floor(Math.random() * 12) + 30    // Random width 30-42
      };

      books.push(newBook);
      renderBooks();
      document.getElementById('bookTitleInput').value = '';
    });

    // --- 4. HIỆU ỨNG CÁNH HOA ĐÀO RƠI (CHERRY BLOSSOM PETALS) ---
    const canvas = document.getElementById('petals-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    class Petal {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height - height;
        this.size = Math.random() * 8 + 6;
        this.speedY = Math.random() * 1 + 0.8;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.angle = Math.random() * 360;
        this.spin = Math.random() * 0.02 - 0.01;
        this.opacity = Math.random() * 0.5 + 0.4;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.angle += this.spin;

        if (this.y > height + 20) {
          this.y = -20;
          this.x = Math.random() * width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        
        ctx.beginPath();
        ctx.fillStyle = '#f7c5d0';
        // Form hình cánh hoa nhẹ nhàng
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
        ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
        ctx.fill();
        
        ctx.restore();
      }
    }

    const petals = Array.from({ length: 28 }, () => new Petal());

    function animatePetals() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    // Khởi chạy ứng dụng
    renderBooks();
    animatePetals();
  </script>
</body>
</html>
